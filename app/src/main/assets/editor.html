<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Tycoon Editor</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylon.gridMaterial.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #111; color: white; font-family: sans-serif; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
        
        #difficulty-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #222;
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #0ff;
            text-align: center;
        }
        .difficulty-btns {
            display: flex; gap: 20px; margin-top: 30px;
        }
        .diff-btn {
            padding: 15px 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            border-radius: 10px; border: 2px solid transparent; transition: all 0.2s;
        }
        .diff-btn.easy { background: #4CAF50; color: white; }
        .diff-btn.medium { background: #FFC107; color: black; }
        .diff-btn.difficult { background: #F44336; color: white; }

        #ui-panel {
            position: absolute; top: 20px; right: 20px; width: 250px;
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px;
            border: 1px solid #0ff; max-height: 80vh; overflow-y: auto;
        }
        
        h2 { font-size: 1.2rem; color: #0ff; margin-top: 0; }
        .road-item {
            display: flex; align-items: center; padding: 8px; margin-bottom: 5px;
            background: #222; cursor: pointer; border-radius: 5px; border: 1px solid transparent;
        }
        .road-item:hover { background: #333; border-color: #0ff; }
        .road-item.selected { border-color: #f0f; background: #444; }
        .road-item img { width: 40px; height: 40px; margin-right: 10px; border-radius: 3px; }
        
        #controls {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 15px;
        }
        
        .btn {
            background: #0ff; color: #000; border: none; padding: 10px 20px;
            font-weight: bold; border-radius: 5px; cursor: pointer; transition: all 0.2s;
        }
        .btn.delete-mode { background: #555; color: white; }
        .btn.delete-mode.active { background: #f44336; box-shadow: 0 0 15px #f44336; }
        .btn.create { background: #f0f; color: white; }
        
        #info {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div id="difficulty-modal">
        <div class="modal-content">
            <h2>에셋을 배치할 맵을 선택하세요</h2>
            <div class="difficulty-btns">
                <button class="diff-btn easy" onclick="selectDifficulty('EASY')">EASY</button>
                <button class="diff-btn medium" onclick="selectDifficulty('MEDIUM')">MEDIUM</button>
                <button class="diff-btn difficult" onclick="selectDifficulty('DIFFICULT')">DIFFICULT</button>
            </div>
        </div>
    </div>

    <div id="info">
        WASD: Move Camera | R: Rotate Road | Mouse Drag: Rotate View<br>
        <b>Vehicle: Start Position (Drag to move, R to rotate)</b><br>
        <b>Green Box: Parking Spot (Drag to move)</b>
    </div>
    
    <canvas id="renderCanvas"></canvas>
    
    <div id="ui-panel">
        <h2>Road Palette</h2>
        <div id="palette"></div>
    </div>
    
    <div id="controls">
        <button id="btn-edit" class="btn" onclick="toggleEditMode()">✏️ 편집 모드 OFF</button>
        <button id="btn-delete" class="btn delete-mode" onclick="toggleDeleteMode()">🗑️ 삭제 모드 OFF</button>
        <button class="btn" onclick="clearMap()">전체 초기화</button>
        <button class="btn create" onclick="exportMap()">만들기 (Apply to Game)</button>
    </div>

    <!-- 정밀 조정 패널 -->
    <div id="transform-panel" style="display: none; position: absolute; bottom: 80px; right: 20px; background: rgba(0,0,0,0.9); padding: 20px; border-radius: 15px; border: 2px solid #f0f; width: 220px;">
        <h3 style="margin: 0 0 15px 0; color: #f0f; font-size: 1rem;">🎯 블록 정밀 조정</h3>
        
        <div class="adj-group" style="margin-bottom: 10px;">
            <label style="display: block; font-size: 0.8rem; margin-bottom: 5px;">가로 (X)</label>
            <button class="btn" style="padding: 5px 10px;" onmousedown="startAdjust('x', -0.1)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">-0.1</button>
            <button class="btn" style="padding: 5px 10px;" onmousedown="startAdjust('x', 0.1)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">+0.1</button>
        </div>

        <div class="adj-group" style="margin-bottom: 10px;">
            <label style="display: block; font-size: 0.8rem; margin-bottom: 5px;">높이 (Y)</label>
            <button class="btn" style="padding: 5px 10px; background: #ff0;" onmousedown="startAdjust('y', -0.1)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">-0.1</button>
            <button class="btn" style="padding: 5px 10px; background: #ff0;" onmousedown="startAdjust('y', 0.1)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">+0.1</button>
        </div>

        <div class="adj-group" style="margin-bottom: 10px;">
            <label style="display: block; font-size: 0.8rem; margin-bottom: 5px;">세로 (Z)</label>
            <button class="btn" style="padding: 5px 10px;" onmousedown="startAdjust('z', -0.1)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">-0.1</button>
            <button class="btn" style="padding: 5px 10px;" onmousedown="startAdjust('z', 0.1)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">+0.1</button>
        </div>

        <div class="adj-group" style="margin-bottom: 10px;">
            <label style="display: block; font-size: 0.8rem; margin-bottom: 5px;">회전 (R)</label>
            <button class="btn" style="padding: 5px 10px; background: #0f0;" onmousedown="startAdjust('rot', -0.02)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">-1°</button>
            <button class="btn" style="padding: 5px 10px; background: #0f0;" onmousedown="startAdjust('rot', 0.02)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">+1°</button>
        </div>

        <div id="wall-settings" style="margin-top: 15px; border-top: 1px solid #555; padding-top: 10px;">
            <label style="display: block; font-size: 0.8rem; margin-bottom: 8px; color: #f0f;">🚫 투명벽 설정</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                <label style="font-size: 0.75rem;"><input type="checkbox" id="wall-f" onchange="updateWallSettings()"> 전(F)</label>
                <label style="font-size: 0.75rem;"><input type="checkbox" id="wall-b" onchange="updateWallSettings()"> 후(B)</label>
                <label style="font-size: 0.75rem;"><input type="checkbox" id="wall-l" onchange="updateWallSettings()"> 좌(L)</label>
                <label style="font-size: 0.75rem;"><input type="checkbox" id="wall-r" onchange="updateWallSettings()"> 우(R)</label>
            </div>
        </div>
        
        <button class="btn" style="width: 100%; margin-top: 10px; background: #555; color: white;" onclick="deselectObject()">선택 해제</button>
    </div>

    <script src="editor.js"></script>
</body>
</html>
