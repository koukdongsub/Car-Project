<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Car Parking</title>
    <link rel="stylesheet" href="style.css">
    <!-- Babylon.js 엔진 로드 -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/draco/draco_decoder_gltf.js"></script>
</head>
<body>
    <!-- 스플래시 화면 -->
    <div id="splash-screen" class="screen">
        <div class="splash-particles">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>
        <div class="logo-container">
            <svg class="car-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150">
                <defs>
                    <filter id="gc"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    <filter id="gs"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e4a7a"/><stop offset="100%" stop-color="#0a1c35"/></linearGradient>
                    <linearGradient id="winG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="rgba(120,220,255,0.7)"/><stop offset="100%" stop-color="rgba(0,80,180,0.3)"/></linearGradient>
                    <radialGradient id="whlG" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#2a2a3a"/><stop offset="100%" stop-color="#080810"/></radialGradient>
                    <radialGradient id="rimG"><stop offset="0%" stop-color="#00eeff"/><stop offset="100%" stop-color="#0055aa"/></radialGradient>
                </defs>
                <!-- Ground glow -->
                <ellipse cx="150" cy="138" rx="135" ry="7" fill="#00ccff" opacity="0.12" filter="url(#gs)"/>
                <!-- Car body -->
                <path d="M25 108 L28 82 Q34 70 58 56 Q85 42 115 40 L185 40 Q218 40 244 56 L268 80 L272 108 Z" fill="url(#bodyG)" stroke="#00d4ff" stroke-width="1.8" filter="url(#gc)"/>
                <!-- Roof -->
                <path d="M108 40 Q125 16 168 16 Q198 16 210 40 Z" fill="#102030" stroke="#00d4ff" stroke-width="1.5" filter="url(#gc)"/>
                <!-- Front windshield -->
                <path d="M168 16 Q198 16 210 40 L185 40 Q175 24 168 16 Z" fill="url(#winG)" opacity="0.85"/>
                <!-- Rear window -->
                <path d="M108 40 Q125 16 155 16 L168 16 Q160 28 145 40 Z" fill="url(#winG)" opacity="0.6"/>
                <!-- Door line -->
                <line x1="148" y1="40" x2="148" y2="108" stroke="#00aacc" stroke-width="0.8" opacity="0.4"/>
                <!-- Hood -->
                <path d="M244 56 L268 80 Q260 62 244 56 Z" fill="#152a45" stroke="#00d4ff" stroke-width="1"/>
                <!-- Headlights -->
                <path d="M265 72 L272 80 L272 90 L258 90 L255 82 L260 72 Z" fill="#00eeff" filter="url(#gs)" opacity="0.95"/>
                <path d="M265 75 L270 82 L268 88 L260 88 L258 84 L261 75 Z" fill="white" opacity="0.9"/>
                <!-- Taillights -->
                <path d="M25 78 L30 70 L36 72 L36 100 L28 100 Z" fill="#ff2255" filter="url(#gs)" opacity="0.9"/>
                <!-- Neon underglow -->
                <line x1="55" y1="110" x2="245" y2="110" stroke="#00ffff" stroke-width="2" opacity="0.5" filter="url(#gc)"/>
                <!-- Spoiler -->
                <rect x="20" y="66" width="14" height="4" rx="2" fill="#1e4a7a" stroke="#00d4ff" stroke-width="1"/>
                <!-- Wheel wells -->
                <circle cx="82" cy="110" r="30" fill="#050a12" stroke="#0a2040" stroke-width="2"/>
                <circle cx="215" cy="110" r="30" fill="#050a12" stroke="#0a2040" stroke-width="2"/>
                <!-- Rear wheel -->
                <circle cx="82" cy="110" r="26" fill="url(#whlG)" stroke="#00ccff" stroke-width="2"/>
                <circle cx="82" cy="110" r="16" fill="none" stroke="#00aacc" stroke-width="1" opacity="0.7"/>
                <line x1="82" y1="85" x2="82" y2="135" stroke="#00ccff" stroke-width="2" opacity="0.8"/>
                <line x1="57" y1="110" x2="107" y2="110" stroke="#00ccff" stroke-width="2" opacity="0.8"/>
                <line x1="64" y1="92" x2="100" y2="128" stroke="#00ccff" stroke-width="2" opacity="0.8"/>
                <line x1="100" y1="92" x2="64" y2="128" stroke="#00ccff" stroke-width="2" opacity="0.8"/>
                <circle cx="82" cy="110" r="6" fill="url(#rimG)" filter="url(#gc)"/>
                <!-- Front wheel -->
                <circle cx="215" cy="110" r="26" fill="url(#whlG)" stroke="#00ccff" stroke-width="2"/>
                <circle cx="215" cy="110" r="16" fill="none" stroke="#00aacc" stroke-width="1" opacity="0.7"/>
                <line x1="215" y1="85" x2="215" y2="135" stroke="#00ccff" stroke-width="2" opacity="0.8"/>
                <line x1="190" y1="110" x2="240" y2="110" stroke="#00ccff" stroke-width="2" opacity="0.8"/>
                <line x1="197" y1="92" x2="233" y2="128" stroke="#00ccff" stroke-width="2" opacity="0.8"/>
                <line x1="233" y1="92" x2="197" y2="128" stroke="#00ccff" stroke-width="2" opacity="0.8"/>
                <circle cx="215" cy="110" r="6" fill="url(#rimG)" filter="url(#gc)"/>
                <!-- Body accent stripe -->
                <path d="M55 82 Q150 76 268 84" fill="none" stroke="#00ffff" stroke-width="1.2" opacity="0.4"/>
            </svg>
            <div class="splash-title-wrap">
                <h1 class="logo-text">CAR PARKING</h1>
                <div class="logo-tagline">PREMIUM DRIVING EXPERIENCE</div>
            </div>
        </div>
    </div>

    <!-- 메인 메뉴 -->
    <script>
    window.addEventListener('load', () => {
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            const menu = document.getElementById('main-menu');
            if (splash) splash.classList.add('hidden');
            if (menu) menu.classList.remove('hidden');
        }, 4500);
    });
</script>
    <div id="main-menu" class="screen hidden">
        <div class="title-container">
            <h1 class="main-title">CAR PARKING</h1>
        </div>
        
        <!-- 차량 선택 화면 (주차장 컨셉) -->
        <div id="vehicle-selection">
            <h2 class="selection-title">CHOOSE YOUR VEHICLE</h2>
            <div class="parking-lot">
                <!-- Sedan -->
                <div class="parking-spot" onclick="selectVehicle('sedan')">
                    <div class="spot-lines"></div>
                    <div class="spot-label">A-01</div>
                    <div class="car-model sedan-svg">
                        <svg viewBox="0 0 60 120" xmlns="http://www.w3.org/2000/svg">
                            <rect x="10" y="10" width="40" height="100" rx="8" fill="#1b4d82"/>
                            <rect x="15" y="40" width="30" height="30" rx="4" fill="#0f1f2e"/> 
                            <rect x="15" y="30" width="30" height="10" fill="rgba(120,220,255,0.7)"/> 
                            <rect x="15" y="70" width="30" height="8" fill="rgba(120,220,255,0.5)"/> 
                            <circle cx="20" cy="15" r="4" fill="#e0f7fa" filter="drop-shadow(0 -5px 6px #00ffff)"/> 
                            <circle cx="40" cy="15" r="4" fill="#e0f7fa" filter="drop-shadow(0 -5px 6px #00ffff)"/>
                            <rect x="14" y="105" width="10" height="3" fill="#ff3333" filter="drop-shadow(0 3px 5px #ff0000)"/> 
                            <rect x="36" y="105" width="10" height="3" fill="#ff3333" filter="drop-shadow(0 3px 5px #ff0000)"/>
                        </svg>
                    </div>
                    <div class="v-info">
                        <div class="v-name">SEDAN</div>
                        <div class="v-desc">STANDARD / BALANCED</div>
                    </div>
                </div>
                <!-- Sports -->
                <div class="parking-spot" onclick="selectVehicle('sports')">
                    <div class="spot-lines"></div>
                    <div class="spot-label">A-02</div>
                    <div class="car-model sports-svg">
                        <svg viewBox="0 0 60 120" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 15 L48 15 L52 60 L46 110 L14 110 L8 60 Z" fill="#b31414"/>
                            <path d="M18 45 L42 45 L44 65 L40 75 L20 75 L16 65 Z" fill="#0f0505"/> 
                            <rect x="18" y="35" width="24" height="10" fill="rgba(120,220,255,0.7)"/> 
                            <polygon points="20,15 40,15 35,25 25,25" fill="#222"/> 
                            <circle cx="18" cy="18" r="3" fill="#0ff" filter="drop-shadow(0 -6px 8px #00ffff)"/> 
                            <circle cx="42" cy="18" r="3" fill="#0ff" filter="drop-shadow(0 -6px 8px #00ffff)"/>
                            <rect x="14" y="107" width="12" height="2" fill="#ff1111" filter="drop-shadow(0 4px 8px #ff0000)"/> 
                            <rect x="34" y="107" width="12" height="2" fill="#ff1111" filter="drop-shadow(0 4px 8px #ff0000)"/>
                            <rect x="16" y="102" width="28" height="4" fill="#111"/> 
                        </svg>
                    </div>
                    <div class="v-info">
                        <div class="v-name">SPORTS</div>
                        <div class="v-desc">HIGH SPEED / DRIFT</div>
                    </div>
                </div>
                <!-- Truck -->
                <div class="parking-spot" onclick="selectVehicle('truck')">
                    <div class="spot-lines"></div>
                    <div class="spot-label">A-03</div>
                    <div class="car-model truck-svg">
                        <svg viewBox="0 0 60 120" xmlns="http://www.w3.org/2000/svg">
                            <rect x="6" y="5" width="48" height="110" rx="3" fill="#a87208"/>
                            <rect x="8" y="45" width="44" height="65" fill="#222"/> 
                            <rect x="10" y="15" width="40" height="25" rx="3" fill="#1c1304"/> 
                            <rect x="10" y="10" width="40" height="5" fill="rgba(120,220,255,0.7)"/> 
                            <rect x="12" y="6" width="10" height="4" fill="#fff" filter="drop-shadow(0 -5px 6px #fff)"/> 
                            <rect x="38" y="6" width="10" height="4" fill="#fff" filter="drop-shadow(0 -5px 6px #fff)"/>
                            <rect x="8" y="108" width="14" height="3" fill="#f00" filter="drop-shadow(0 3px 5px #f00)"/> 
                            <rect x="38" y="108" width="14" height="3" fill="#f00" filter="drop-shadow(0 3px 5px #f00)"/>
                        </svg>
                    </div>
                    <div class="v-info">
                        <div class="v-name">TRUCK</div>
                        <div class="v-desc">HEAVY / HARD CONTROL</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 난이도 선택 화면 (글래스모피즘 모달) -->
        <div id="difficulty-selection" class="hidden">
            <div class="glass-modal">
                <div class="modal-header">
                    <h3 id="selected-vehicle-text"></h3>
                    <h2 class="modal-title">SELECT MODE</h2>
                </div>
                <div class="difficulty-buttons">
                    <button class="menu-btn free" onclick="startGame('FREE')">
                        <span class="btn-text">FREE RIDE</span>
                    </button>
                    <button class="menu-btn easy" onclick="startGame('EASY')">
                        <span class="btn-text">EASY</span>
                    </button>
                    <button class="menu-btn medium" onclick="startGame('MEDIUM')">
                        <span class="btn-text">MEDIUM</span>
                    </button>
                    <button class="menu-btn difficult" onclick="startGame('DIFFICULT')">
                        <span class="btn-text">DIFFICULT</span>
                    </button>
                </div>
                <button class="back-btn" onclick="backToVehicle()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    MAIN MENU
                </button>
            </div>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div id="game-screen" class="screen hidden">
        <!-- 옵션 버튼 추가 -->
        <button id="btn-option" class="option-btn" onclick="backToMenu()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <!-- 상단 게임 HUD (타이머 및 미니맵) -->
        <div id="game-hud">
            <div id="timer-box">
                ⏱️ TIME: <span id="timer">00</span>
            </div>
            <!-- 실시간 레이더(미니맵) -->
            <canvas id="minimap" width="120" height="120"></canvas>
        </div>

        <!-- 3D 렌더링 컨테이너 -->
        <div id="canvas-container">
            <!-- Three.js 캔버스가 이 위치에 동적으로 삽입됨 -->
        </div>
        
        <!-- 결과 오버레이 -->
        <div id="game-overlay" class="hidden">
            <h2 id="result-message"></h2>
            <button id="btn-main-menu" onclick="backToMenu()">MAIN MENU</button>
        </div>
        
        <!-- 하단 컨트롤러 -->
        <div id="controller-container">
            <!-- 가상 핸들 -->
            <div class="steering-wheel-container">
                <div id="steering-wheel">
                    <div class="wheel-center"></div>
                    <div class="wheel-spoke left"></div>
                    <div class="wheel-spoke right"></div>
                    <div class="wheel-spoke bottom"></div>
                </div>
            </div>

            <!-- 기어 레버 (전진/후진 단순화) -->
            <div id="gear-selector">
                <div class="gear-btn active" onclick="setGear('D')">D</div>
                <div class="gear-btn" onclick="setGear('R')">R</div>
            </div>

            <!-- 페달 컨트롤 -->
            <div class="pedal-controls">
                <button id="btn-brake" class="ctrl-btn brake-btn">BRAKE</button>
                <button id="btn-gas" class="ctrl-btn gas-btn">ACCEL</button>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
